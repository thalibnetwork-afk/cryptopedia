name: Daily Crypto Sentiment Alert

on:
  schedule:
    # 4 kali sehari (WITA = UTC+8):
    # 21:55 UTC = ~05:55 / 06:00 WITA (pagi)
    # 03:55 UTC = ~11:55 / 12:00 WITA (siang)
    # 09:55 UTC = ~17:55 / 18:00 WITA (sore)
    # 15:55 UTC = ~23:55 / 00:00 WITA (malam)
    - cron: '55 21,3,9,15 * * *'
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser google-genai

    - name: Run sentiment script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python crypto_daily_alert.py
