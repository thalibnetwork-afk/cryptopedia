name: Daily Crypto Sentiment Alert

on:
  schedule:
    # Eksekusi 4x sehari (WITA = UTC+8):
    # 22:00 UTC = 06:00 WITA (pagi)
    # 04:00 UTC = 12:00 WITA (siang)
    # 10:00 UTC = 18:00 WITA (sore)
    # 16:00 UTC = 00:00 WITA (malam)
    - cron: '0 22,4,10,16 * * *'
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser google-genai

    - name: Run sentiment script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python crypto_daily_alert.py
